<style>
/* Layout: one centred study column. Controls on top, a single large card, two answer buttons fixed under it. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#16212b; --muted:#5d6b78; --line:#d5dce3;
  --accent:#b0225f; --accent-ink:#ffffff; --ok:#17703f; --ok-bg:#e3f4ea; --miss:#a4351b; --miss-bg:#fbe9e4;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif; --sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#17232d; --ink:#e8eef3; --muted:#9aaab7; --line:#2b3b48;
  --accent:#f06fa4; --accent-ink:#1a0610; --ok:#6fd49a; --ok-bg:#12301f; --miss:#ff9b80; --miss-bg:#3a1b13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#17232d; --ink:#e8eef3; --muted:#9aaab7; --line:#2b3b48;
  --accent:#f06fa4; --accent-ink:#1a0610; --ok:#6fd49a; --ok-bg:#12301f; --miss:#ff9b80; --miss-bg:#3a1b13; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:1.55rem;margin:0;text-wrap:balance;line-height:1.15}
.stat{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .82rem var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lab{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .m{background:var(--miss)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 20px;min-height:260px;cursor:pointer;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;color:inherit;font:inherit}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q{font-family:var(--serif);font-size:1.3rem;line-height:1.3;font-weight:500;text-wrap:balance}
.a{border-top:1px dashed var(--line);padding-top:14px;font-size:1rem}
.a b{font-weight:600;color:var(--accent)}
.tip{font-size:.85rem;color:var(--muted);margin-top:8px}
.hint{color:var(--muted);font-size:.85rem;margin-top:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:600 1rem var(--sans);border-radius:10px;padding:14px;border:1px solid var(--line);cursor:pointer;min-height:50px}
.btn.g{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.btn.m{background:var(--miss-bg);color:var(--miss);border-color:var(--miss)}
.btn[disabled]{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--muted);font:500 .85rem var(--sans);cursor:pointer;padding:8px 4px;text-decoration:underline}
.done{text-align:center;padding:30px 10px}
.done h2{font-family:var(--serif);margin:0 0 6px}
@media (max-width:420px){.q{font-size:1.15rem}.card{padding:18px 16px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>

<script>
const DATA = [{"id": "mod5", "name": "Module 5: Heredity", "short": "Mod 5", "cards": [{"q": "Define hormone.", "a": "Chemical messengers produced by the body, which travel in the blood to other cells where they have a specific effect.", "t": "recall"}, {"q": "Where is oestrogen made in pregnancy? Roles (4)?", "a": "The placenta. Stimulates ovulation, aids blood flow to offspring, aids organ development, stimulates progesterone.", "t": "recall"}, {"q": "Progesterone: made by? Roles (3)?", "a": "Ovaries, then placenta. Stimulates thickening of uterus lining; aids placenta function and relaxes uterus; helps mother's immune system tolerate infant.", "t": "recall"}, {"q": "Relaxin and oxytocin roles?", "a": "Relaxin loosens uterine muscles during pregnancy. Oxytocin stimulates milk production and triggers uterine contractions.", "t": "recall"}, {"q": "Define artificial insemination.", "a": "Taking sperm from a male animal and inserting it directly into the female's reproductive tract.", "t": "recall"}, {"q": "Define artificial pollination.", "a": "Taking pollen from one flower and inserting it into another flower using a small brush.", "t": "recall"}, {"q": "Define cloning (agriculture).", "a": "Creating a genetically identical copy of an organism.", "t": "recall"}, {"q": "DNA vs RNA: sugar, bases, strands?", "a": "DNA: deoxyribose, GCAT, double-stranded (helix). RNA: ribose, GCAU, single-stranded.", "t": "recall"}, {"q": "Prokaryote vs eukaryote DNA?", "a": "Prokaryote: no nucleus, circular DNA in cytoplasm. Eukaryote: nucleus + membrane-bound organelles, linear DNA in nucleus.", "t": "recall"}, {"q": "What does DNA helicase do?", "a": "Breaks the hydrogen bonds between the DNA strands, unwinding the double helix.", "t": "recall"}, {"q": "What does DNA polymerase do in replication?", "a": "Binds free nucleotides to their complementary bases on the exposed strands.", "t": "recall"}, {"q": "Product of replication?", "a": "Two DNA molecules, each with one old and one new strand.", "t": "recall"}, {"q": "Mitosis stages in order?", "a": "DNA replication → prophase → metaphase → anaphase → telophase.", "t": "recall"}, {"q": "What happens in anaphase (mitosis)?", "a": "Spindle fibres shorten, centromeres break and chromatids move apart.", "t": "recall"}, {"q": "Meiosis: two key variation events?", "a": "Random (independent) assortment of homologous pairs; crossing over (homologous chromosomes swap sections).", "t": "recall"}, {"q": "Meiosis end product?", "a": "4 non-identical daughter cells (gametes: sperm/eggs).", "t": "recall"}, {"q": "Three sources of genetic variation (sexual)?", "a": "Meiosis (independent assortment/random segregation + crossing over), fertilisation, mutation (new alleles).", "t": "recall"}, {"q": "What links amino acids in a protein? Functions?", "a": "Peptide bonds. Structural proteins, enzymes, hormones, antibodies.", "t": "recall"}, {"q": "Biuret test result for protein?", "a": "Add CuSO4 → purple colour change.", "t": "recall"}, {"q": "Define gene.", "a": "A sequence of bases in DNA that codes for a specific protein.", "t": "recall"}, {"q": "Enzyme that makes mRNA?", "a": "RNA polymerase.", "t": "recall"}, {"q": "What is splicing?", "a": "Introns are cut out and exons are joined together.", "t": "recall"}, {"q": "How does mRNA leave the nucleus?", "a": "Through a (nuclear) pore into the cytoplasm.", "t": "recall"}, {"q": "Translation in one line?", "a": "mRNA attaches to ribosome; complementary tRNA brings amino acids; they bind forming a polypeptide; stop codon releases it.", "t": "recall"}, {"q": "Gel electrophoresis separates by…? Which travel furthest?", "a": "Size. Smallest fragments.", "t": "recall"}, {"q": "Which 3 techniques use PCR + gel electrophoresis?", "a": "DNA sequencing, DNA profiling, recombinant DNA.", "t": "recall"}, {"q": "Sanger sequencing: what's special about the nucleotides?", "a": "They are chain-terminating nucleotides (4 reactions); fluorescent in capillary method.", "t": "recall"}, {"q": "How do you read a sequencing gel?", "a": "Read the complementary base of the tube with the smallest fragment first, then work back towards the wells.", "t": "recall"}, {"q": "Define STR.", "a": "Short tandem repeat: a string of repeating nucleotide units; number of units varies between people.", "t": "recall"}, {"q": "Why do primers 'flank' the STR?", "a": "So PCR amplifies only the STR region, whose length differs between people.", "t": "recall"}, {"q": "DNA profile in a child comes from…?", "a": "A combination of both parents' alleles.", "t": "recall"}, {"q": "How is a suspect identified by DNA profile?", "a": "The person whose profile matches the one from the scene.", "t": "recall"}, {"q": "Describe how DNA is replicated. (3 marks)", "a": "<b>DNA helicase<\/b> breaks the <b>hydrogen bonds<\/b> between the strands, <b>unwinding the double helix<\/b> and exposing both strands. <b>DNA polymerase<\/b> binds <b>free nucleotides<\/b> to their <b>complementary bases<\/b> on each exposed strand. This produces <b>two DNA molecules<\/b>, each with <b>one old and one new strand<\/b>.", "t": "answer", "tip": "Three points = three marks: unwind (helicase) · complementary pairing (polymerase) · one old + one new."}, {"q": "Compare mitosis and meiosis. (4 marks)", "a": "<b>Similarity:<\/b> both begin with <b>DNA replication<\/b> and chromatin condensing into chromosomes. <b>Difference:<\/b> in mitosis chromosomes <b>line up individually<\/b> and chromatids separate once, producing <b>2 identical<\/b> daughter cells; in meiosis chromosomes line up as <b>homologous pairs<\/b> (random assortment), <b>crossing over<\/b> occurs, and there are two divisions producing <b>4 non-identical<\/b> daughter cells (gametes).", "t": "answer", "tip": "Compare = similarities AND differences. Use linking words: 'whereas', 'in contrast'."}, {"q": "Explain how sexual reproduction results in genetic variation. (4 marks)", "a": "<b>Meiosis<\/b> produces variation through <b>independent assortment and random segregation<\/b>, so different combinations of chromatids end up in gametes, and <b>crossing over<\/b>, where homologous chromosomes swap sections and change their genetic composition. <b>Fertilisation<\/b> allows different gametes to combine, creating new combinations of alleles. <b>Mutation<\/b> produces new alleles that can be passed on.", "t": "answer", "tip": "Name all 3 sources, and say WHAT each does (not just 'it causes variation')."}, {"q": "Describe the process of protein synthesis. (6 marks)", "a": "<b>Transcription (nucleus):<\/b> the DNA double helix is <b>unwound<\/b> at the gene, which acts as a <b>template<\/b>. <b>Complementary mRNA nucleotides<\/b> bind to form an mRNA strand, catalysed by <b>RNA polymerase<\/b>. <b>Introns are cut out and exons joined (splicing)<\/b>, and the mRNA leaves the nucleus through a <b>pore<\/b>.<br><b>Translation (cytoplasm):<\/b> mRNA attaches to a <b>ribosome<\/b>. As the ribosome moves along the mRNA, <b>complementary tRNA<\/b> binds to the codons, bringing <b>amino acids<\/b>. Adjacent amino acids bind, forming a <b>polypeptide chain<\/b>. At a <b>stop codon<\/b>, the mRNA, tRNA and ribosome separate, releasing the finished polypeptide.", "t": "answer", "tip": "Two labelled stages. Hit: template · RNA polymerase · splicing · pore · ribosome · tRNA · amino acids · stop codon."}, {"q": "Outline how a DNA profile is produced. (4 marks)", "a": "DNA is <b>collected<\/b> (e.g. hair, saliva, blood) and <b>extracted<\/b>, separating it from proteins. <b>STR regions<\/b> are <b>amplified by PCR<\/b> using <b>primers that flank the STR region<\/b>. The <b>length<\/b> of the STR fragments is determined by <b>gel or capillary electrophoresis<\/b>. The resulting gel/<b>electropherogram<\/b> is <b>interpreted<\/b>; because the number of repeats varies, people have STRs of <b>different lengths<\/b>.", "t": "answer", "tip": "Outline = short sequential steps. Don't explain each."}, {"q": "The DNA profiles of a mother, a child and two males are shown on a gel. Explain how DNA profiling can determine which male is the father. (3 marks)", "a": "A child's DNA profile is a <b>combination of the alleles of both parents<\/b>. Each band in the child's profile must match a band from either the <b>mother or the father<\/b>. The male whose profile contains the bands the child did <b>not<\/b> inherit from the mother is the father; a male whose bands <b>do not match<\/b> the child's remaining bands is excluded.", "t": "answer", "tip": "Data Qs: point to specific lanes/bands ('Male 1 has no matching bands at the 2nd and 4th position')."}, {"q": "Outline how Sanger DNA sequencing is carried out. (4 marks)", "a": "A DNA sample is <b>collected and extracted<\/b>, then <b>amplified by PCR<\/b> if necessary. <b>Four Sanger reactions<\/b> are performed using <b>chain-terminating nucleotides<\/b>, producing fragments of different lengths. These are separated by <b>gel electrophoresis<\/b> (read the <b>complementary base<\/b> starting from the <b>smallest fragment<\/b> and working back towards the wells) or <b>capillary electrophoresis<\/b> (read the <b>fluorescent<\/b> chain-terminating nucleotides left to right).", "t": "answer", "tip": ""}, {"q": "Compare DNA and RNA. (3 marks)", "a": "DNA contains <b>deoxyribose<\/b> sugar and the base <b>thymine<\/b> and is <b>double-stranded<\/b>, whereas RNA contains <b>ribose<\/b> sugar and the base <b>uracil<\/b> and is <b>single-stranded<\/b>. Both are nucleic acids made of <b>nucleotides<\/b> (phosphate + sugar + base) containing G, C and A.", "t": "answer", "tip": ""}, {"q": "Explain the role of oestrogen and progesterone in pregnancy. (4 marks)", "a": "<b>Oestrogen<\/b> (made by the placenta) stimulates <b>ovulation<\/b>, <b>aids blood flow to the offspring<\/b> and <b>organ development<\/b>, and stimulates <b>progesterone<\/b>. <b>Progesterone<\/b> (made by the ovaries then the placenta) stimulates <b>thickening of the uterus lining<\/b>, aids <b>placenta function<\/b> and <b>relaxes the uterus<\/b>, and helps the mother's <b>immune system tolerate<\/b> the infant.", "t": "answer", "tip": "Link hormone → effect → pregnancy benefit."}, {"q": "Distinguish between artificial insemination and artificial pollination, and assess one advantage and one disadvantage of artificial insemination. (4 marks)", "a": "<b>Artificial insemination<\/b> involves taking <b>sperm<\/b> from a male <b>animal<\/b> and inserting it directly into the <b>female's reproductive tract<\/b>; <b>artificial pollination<\/b> involves transferring <b>pollen<\/b> from one <b>flower<\/b> to another using a brush. <b>Advantage:<\/b> sperm from a male with desirable traits can fertilise many females, quickly improving the herd. <b>Disadvantage:<\/b> repeated use of few males <b>reduces genetic diversity<\/b>, so the population is more vulnerable to disease or environmental change.", "t": "answer", "tip": "Advantage/disadvantage reasoning is not on your slides — keep it to one linked sentence each."}, {"q": "Explain how gel electrophoresis separates DNA fragments. (2 marks)", "a": "An <b>electric current<\/b> moves the DNA fragments through the gel. <b>Smaller fragments travel further<\/b> than larger fragments, so the fragments are <b>separated by size<\/b>.", "t": "answer", "tip": ""}, {"q": "Explain why PCR is used before DNA profiling. (2 marks)", "a": "PCR <b>amplifies (makes many copies of) the STR regions<\/b>, using primers that flank the STR, producing enough DNA to <b>measure the fragment lengths<\/b> by electrophoresis from a small sample.", "t": "answer", "tip": ""}]}, {"id": "mod6", "name": "Module 6: Genetic Change", "short": "Mod 6", "cards": [{"q": "How does EM radiation (UV, X-ray, gamma) cause mutation?", "a": "Causes atoms to vibrate and lose electrons, breaking bonds and damaging DNA.", "t": "recall"}, {"q": "3 ways chemical mutagens act?", "a": "Incorporate into DNA; insert into DNA; make gaps in DNA.", "t": "recall"}, {"q": "Define point mutation. Cause?", "a": "Change in only one nucleotide; errors in DNA replication.", "t": "recall"}, {"q": "Silent / missense / nonsense?", "a": "Silent: no effect. Missense: different amino acid. Nonsense: creates a stop codon.", "t": "recall"}, {"q": "Frameshift effect?", "a": "All codons after the mutation are affected, leading to different amino acids.", "t": "recall"}, {"q": "Example of point mutation?", "a": "Sickle cell anaemia.", "t": "recall"}, {"q": "Define chromosomal mutation + 5 types.", "a": "Any change in arrangement/structure of a chromosome affecting large DNA sections. Deletion, inversion, translocation, duplication, non-disjunction.", "t": "recall"}, {"q": "Cause of chromosomal mutations? Example?", "a": "Spontaneous errors during meiosis (sometimes mutagens). Down syndrome.", "t": "recall"}, {"q": "Germ-line vs somatic effect on offspring?", "a": "Germ-line: all cells of offspring have it. Somatic: none.", "t": "recall"}, {"q": "Somatic mutation effect on organism?", "a": "All daughter cells from the mutated cell have it (e.g. lung cancer).", "t": "recall"}, {"q": "Coding vs non-coding DNA?", "a": "Coding: codes for amino acid sequence of a protein. Non-coding: doesn't code for protein.", "t": "recall"}, {"q": "Non-coding DNA mutation effects (3)?", "a": "Functional RNA: efficiency of protein synthesis changes. Regulatory: amount of protein changes. Repetitive: none.", "t": "recall"}, {"q": "Define gene pool.", "a": "Total collection of alleles for all genes in a population.", "t": "recall"}, {"q": "Gene flow / genetic drift?", "a": "Gene flow: movement of alleles between populations. Drift: random events change allele frequency.", "t": "recall"}, {"q": "Positive vs negative selection pressure?", "a": "Positive increases allele frequency; negative decreases it.", "t": "recall"}, {"q": "Artificial embryo twinning steps?", "a": "Fertilised egg → clump of identical unspecialised cells → split → embryos transplanted into new mother.", "t": "recall"}, {"q": "SCNT steps?", "a": "Donor cell + unfertilised egg; egg DNA removed & replaced with donor DNA; electrical impulse triggers division; embryo to surrogate; genetically identical copy born.", "t": "recall"}, {"q": "Cloning plants: 3 methods?", "a": "Cutting, grafting, tissue culture.", "t": "recall"}, {"q": "Tissue culture steps?", "a": "Section pulverised → cells grown on nutrient + hormone medium → sprouts → moved to another medium/natural environment.", "t": "recall"}, {"q": "PCR temperatures & events?", "a": "95°C denaturation; 55°C annealing (primers bind); 72°C extension (DNA polymerase).", "t": "recall"}, {"q": "In vitro vs in vivo gene cloning?", "a": "In vitro (test tube) = PCR. In vivo (living organism) = recombinant DNA in bacteria.", "t": "recall"}, {"q": "Define recombinant DNA.", "a": "DNA containing genes from two or more different sources.", "t": "recall"}, {"q": "4 steps to make recombinant DNA?", "a": "Isolation, digestion (same restriction enzyme), insertion (sticky ends), ligation (DNA ligase).", "t": "recall"}, {"q": "Bacterial transformation steps?", "a": "Ca²⁺ solution + plasmids → heat shock → recovery in nutrient broth → select on antibiotic plate.", "t": "recall"}, {"q": "Why antibiotic plate?", "a": "Bacteria with plasmid are antibiotic resistant and grow; others die.", "t": "recall"}, {"q": "Direct applications of gene cloning?", "a": "DNA sequencing and DNA profiling.", "t": "recall"}, {"q": "Indirect applications?", "a": "Gene analysis and gene therapy (transgenic organisms).", "t": "recall"}, {"q": "Agrobacterium: what is it & why remove tumour-inducing genes?", "a": "Soil bacterium that naturally transfers its plasmid into plant cells. Tumour-inducing genes are removed (so it no longer causes tumours/crown gall) and the desired gene inserted: a recombinant plasmid.", "t": "recall"}, {"q": "Microinjection / biolistics / electroporation / viral vector?", "a": "Micropipette injects DNA / gene gun with DNA-coated metal bullets (plants not susceptible to Agrobacterium) / electrical impulses make membrane holes (big DNA fragments) / gene put in viral genome.", "t": "recall"}, {"q": "Bt cotton: gene, effect, benefits?", "a": "Gene from Bacillus thuringiensis codes for toxin disrupting caterpillar digestive system; higher yield without more insecticide: saves time/money, lower environmental & health impact.", "t": "recall"}, {"q": "Golden Rice?", "a": "Two extra genes (daffodil + soil bacterium) → beta-carotene (vitamin A precursor) → solves vitamin A deficiency in developing countries.", "t": "recall"}, {"q": "How is human insulin made?", "a": "Human insulin gene inserted into plasmid → transforms E. coli → E. coli produce insulin, harvested and purified.", "t": "recall"}, {"q": "OncoMouse?", "a": "Contains a human cancer gene → increased cancer likelihood → used to develop cancer cures.", "t": "recall"}, {"q": "Two adverse effects of transgenic crops?", "a": "Decreased biodiversity (less gene pool variation); reduced populations of other species (e.g. Bt corn pollen → butterflies).", "t": "recall"}, {"q": "Two ethical issues of biotechnology?", "a": "Genetic screening (sacred life from conception) and GMOs (e.g. flounder gene tomatoes vs dietary/religious beliefs).", "t": "recall"}, {"q": "Explain how the use of transgenic crop plants may have adverse biological effects. (4 marks)", "a": "Transgenic crops are created when a gene from another organism is introduced using <b>recombinant DNA technology<\/b>. This can <b>decrease biodiversity within a species<\/b>: introducing the same transgene (e.g. the Bt gene in Bt cotton) into a plant population <b>reduces variation in the gene pool<\/b>, so if a <b>selection pressure<\/b> arises the likelihood that an allele conferring survival is present is reduced. They can also <b>reduce populations of non-target species<\/b>: e.g. <b>Bt corn<\/b> pollen blown onto caterpillar food plants and ingested is toxic, which can <b>decrease butterfly populations<\/b>.", "t": "answer", "tip": "Pattern: effect → because (gene pool / pollen) → named example."}, {"q": "Evaluate relevant ethical issues raised by the use of current biotechnology. (6 marks)", "a": "Biotechnologies provide benefits but should be used with <b>consideration of ethical values<\/b>. <b>Issue 1 – genetic screening:<\/b> allows identification of genetic abnormalities in unborn babies so parents can decide whether to continue the pregnancy; however <b>some religious/cultural groups deem human life sacred from conception<\/b> and disagree with intervention. <b>Issue 2 – GMOs:<\/b> can increase crop yield and quality, e.g. tomatoes with the <b>'antifreeze' gene from winter flounder<\/b> grow in cold climates; however some cultural/religious beliefs prohibit certain foods, so <b>people who avoid meat/fish products may object<\/b> to eating them. <b>Judgement:<\/b> biotechnologies provide considerable advantages, but ethical issues must be considered so that technology does not <b>exploit or harm<\/b> people or the environment.", "t": "answer", "tip": "Evaluate = benefit AND drawback for each issue, then a final judgement sentence."}, {"q": "Describe the process of making a recombinant DNA molecule and getting bacteria to clone the gene. (5 marks)", "a": "The target gene is <b>isolated<\/b> from its source. The gene and the <b>plasmid<\/b> are <b>cut with the same restriction enzyme<\/b> (<b>digestion<\/b>), producing <b>sticky ends<\/b>. The gene is <b>inserted<\/b> into the plasmid as the sticky ends bind, and <b>DNA ligase seals the backbone<\/b> (<b>ligation<\/b>), producing <b>recombinant DNA<\/b>. The plasmid is put into bacteria by <b>transformation<\/b> (Ca²⁺ solution, heat shock, recovery in nutrient broth), and bacteria with the plasmid are selected on an <b>antibiotic plate<\/b>. As the bacteria divide, they <b>clone the gene<\/b>.", "t": "answer", "tip": ""}, {"q": "Describe the stages of PCR. (3 marks)", "a": "<b>Denaturation (95°C):<\/b> the DNA separates into <b>single strands<\/b>. <b>Annealing (55°C):<\/b> <b>primers<\/b> bind to the DNA strands. <b>Extension (72°C):<\/b> <b>DNA polymerase<\/b> synthesises new DNA, producing copies of a <b>specific region<\/b> of DNA.", "t": "answer", "tip": ""}, {"q": "Compare germ-line and somatic mutations. (4 marks)", "a": "A <b>germ-line mutation<\/b> is a change in the DNA of a <b>germ cell<\/b> (a cell that forms sex cells); it has <b>no effect on the organism<\/b> but <b>all cells of the offspring<\/b> will have the mutation (e.g. Down syndrome). A <b>somatic mutation<\/b> is a change in the DNA of a <b>body cell<\/b>; <b>all daughter cells<\/b> of the mutated cell carry it but it is <b>not passed to offspring<\/b> (e.g. lung cancer).", "t": "answer", "tip": ""}, {"q": "Explain the effects of different types of point mutation on a protein. (4 marks)", "a": "A point mutation changes <b>one nucleotide<\/b>. A <b>silent<\/b> substitution has <b>no effect<\/b> on the amino acid sequence; a <b>missense<\/b> substitution codes for a <b>different amino acid<\/b>, which may change protein function (e.g. sickle cell anaemia); a <b>nonsense<\/b> substitution creates a <b>stop codon<\/b>, so the polypeptide is shortened. A <b>frameshift<\/b> affects <b>all codons after the mutation<\/b>, producing different amino acids.", "t": "answer", "tip": ""}, {"q": "Explain how mutagens cause mutations. (3 marks)", "a": "<b>High-energy EM radiation<\/b> (UV, X-rays, gamma) causes atoms to vibrate and lose electrons, <b>breaking bonds<\/b> and damaging DNA. <b>Mutagenic chemicals<\/b> may <b>incorporate or insert themselves into DNA<\/b> or <b>make gaps<\/b> in DNA. <b>Naturally occurring mutagens<\/b> come from microbes, plants and animals. Errors in replication/repair of this damage produce mutations.", "t": "answer", "tip": ""}, {"q": "Outline how a transgenic plant can be produced using Agrobacterium. (4 marks)", "a": "A <b>recombinant plasmid<\/b> containing the <b>desired gene<\/b> (with the <b>tumour-inducing genes removed<\/b>) is created and <b>inserted into Agrobacterium<\/b>. The transformed bacteria are <b>cultured with plant cells<\/b>, injecting the plasmid into them. The plasmid enters the <b>plant's genome<\/b>, and the cells are <b>grown into transgenic adult plants<\/b>.", "t": "answer", "tip": ""}, {"q": "Explain why human insulin can be produced by E. coli. (4 marks)", "a": "The <b>human insulin gene<\/b> is inserted into a <b>plasmid<\/b> by recombinant DNA technology and the plasmid is used to <b>transform E. coli<\/b>. The bacteria express the gene because the genetic code is shared, so E. coli <b>produce human insulin<\/b> as they divide. The insulin is <b>harvested and purified<\/b> and used to treat people with diabetes.", "t": "answer", "tip": "'Genetic code is shared' is extra reasoning — keeps the 'why' in a 'why' Q."}, {"q": "Distinguish between artificial embryo twinning and somatic cell nuclear transfer. (4 marks)", "a": "<b>Artificial embryo twinning:<\/b> a fertilised egg forms a clump of <b>identical unspecialised cells<\/b> that are <b>split<\/b> into separate embryos, which are <b>transplanted<\/b> into mother(s). <b>SCNT:<\/b> the <b>DNA of an unfertilised egg is removed and replaced with DNA from a donor (somatic) cell<\/b>; an <b>electrical impulse<\/b> triggers division, and the embryo is placed in a <b>surrogate<\/b>, giving a <b>genetically identical copy of the donor<\/b>.", "t": "answer", "tip": ""}, {"q": "Explain how changes in a gene pool can occur. (4 marks)", "a": "<b>Gene flow<\/b> moves alleles between populations; <b>genetic drift<\/b> – random events – changes allele frequency; <b>mutation<\/b> introduces <b>new alleles<\/b>; and <b>selection pressures<\/b> change allele frequency – positive ones increase, negative ones decrease the frequency of an allele.", "t": "answer", "tip": ""}]}, {"id": "mod7", "name": "Module 7: Infectious Disease", "short": "Mod 7", "cards": [{"q": "Bacteria definition + 2 diseases?", "a": "Prokaryotic, unicellular organisms. Tuberculosis, tetanus (humans); crown gall (plants).", "t": "recall"}, {"q": "Fungi definition + diseases?", "a": "Eukaryotic, non-photosynthetic, with a cell wall. Athlete's foot, chytridiomycosis (frogs), stem rust (plants).", "t": "recall"}, {"q": "Protists definition + diseases?", "a": "Eukaryotic, unicellular, no cell wall. Malaria; Phytophthora dieback (plants).", "t": "recall"}, {"q": "Viruses definition + diseases?", "a": "Non-cellular, non-living entities. Influenza, Ross River fever, tobacco mosaic virus disease.", "t": "recall"}, {"q": "Prions?", "a": "Infectious proteins. Kuru, Creutzfeldt-Jakob disease.", "t": "recall"}, {"q": "Macroscopic parasites?", "a": "Multicellular pathogens seen with naked eye: ticks, fleas, tapeworm.", "t": "recall"}, {"q": "Koch's postulates (4)?", "a": "Identify microorganism in all infected hosts; isolate & culture; introduce into healthy animal; if disease develops, re-identify original microorganism in the newly infected animal.", "t": "recall"}, {"q": "Why declare plant/animal matter at the border?", "a": "Quarantine: may carry exotic pests/diseases; resident organisms unlikely exposed → susceptible; inspected, treated or destroyed.", "t": "recall"}, {"q": "Neutrophils do what?", "a": "Quickly enter tissues, phagocytose in acute infection; release hydrogen peroxide; release cytokines.", "t": "recall"}, {"q": "Macrophages do what?", "a": "Phagocytose; live longer (chronic infection); antigen presentation to T lymphocytes; release cytokines.", "t": "recall"}, {"q": "Dendritic cells?", "a": "Phagocytosis and antigen presentation.", "t": "recall"}, {"q": "Natural killer cells?", "a": "Release chemicals that kill virus-infected and cancerous cells directly in close proximity.", "t": "recall"}, {"q": "Define inflammation.", "a": "Accumulation of fluid, plasma proteins and white blood cells when tissue is damaged or infected.", "t": "recall"}, {"q": "Complement system?", "a": "Activation of proteins that damage invading pathogens; increases inflammation and activity of phagocytes and antibodies.", "t": "recall"}, {"q": "Plasma cells vs memory B cells?", "a": "Plasma cells produce antibodies; memory B cells stay in lymph tissue giving faster, stronger, longer-lasting response.", "t": "recall"}, {"q": "4 antibody strategies?", "a": "Neutralisation, precipitation, agglutination, activation of complement system.", "t": "recall"}, {"q": "Cytotoxic T cells?", "a": "Kill foreign, infected or abnormal host cells by releasing toxic compounds.", "t": "recall"}, {"q": "Helper T cells?", "a": "Secrete cytokines → increase phagocyte activity, promote inflammation, stimulate B and T lymphocyte production.", "t": "recall"}, {"q": "Suppressor T cells?", "a": "Turn off the immune response after antigen successfully removed.", "t": "recall"}, {"q": "Memory T cells?", "a": "Persist after infection → larger, faster response on reinfection.", "t": "recall"}, {"q": "Active natural / active artificial?", "a": "Natural: response to antigen from a disease. Artificial: vaccination.", "t": "recall"}, {"q": "Passive natural / passive artificial?", "a": "Natural: antibodies from mother. Artificial: injected antibodies from someone else.", "t": "recall"}, {"q": "Plant physical defences?", "a": "Tiny bristles, waxy cuticle, cell wall.", "t": "recall"}, {"q": "Plant chemical defences?", "a": "Antimicrobials and toxins.", "t": "recall"}, {"q": "Plant immune response (4)?", "a": "Basal resistance; gene-for-gene resistance; hypersensitive response (apoptosis); systemic acquired resistance.", "t": "recall"}, {"q": "Gene-for-gene resistance requires?", "a": "Plant has resistance gene AND pathogen lacks virulence gene.", "t": "recall"}, {"q": "Prevention strategies (4)?", "a": "Hygiene practices, vaccination, pesticides, genetic engineering.", "t": "recall"}, {"q": "Control strategies (2)? Both?", "a": "Quarantine, medications. Both: public health campaigns.", "t": "recall"}, {"q": "Hygiene limitation?", "a": "General effect rather than targeting a specific disease.", "t": "recall"}, {"q": "Vaccination benefit?", "a": "Reduces number of people affected; herd immunity for immunocompromised.", "t": "recall"}, {"q": "Antibiotic targets (4)?", "a": "Cell wall synthesis, nucleic acid synthesis, protein synthesis, certain metabolic pathways (e.g. penicillin, sulphonamides).", "t": "recall"}, {"q": "Why antibiotic resistance?", "a": "Overuse/mismanagement; resistant bacteria pass resistance gene to offspring.", "t": "recall"}, {"q": "Antivirals target? Limitation?", "a": "Viral nucleic acids and proteins; block entry/spread. Viruses mutate → resistance.", "t": "recall"}, {"q": "Three data-question factors for disease distribution?", "a": "Travel, population increase, medical advancements.", "t": "recall"}, {"q": "Explain why Pasteur needed to identify and culture the microorganism in order to meet the scientific standards for establishing the cause of rabies. (4 marks)", "a": "Any number of microorganisms in a dog's saliva may be causing rabies, so Pasteur needed to follow <b>Koch's postulates<\/b>: <b>identify<\/b> the suspected microorganism in all infected dogs; <b>isolate and culture<\/b> it; <b>introduce<\/b> it into a <b>healthy animal<\/b>; and, if the animal develops rabies, <b>identify the original microorganism in the newly infected animal<\/b>. If all postulates are met, he could conclude that the microorganism <b>causes<\/b> rabies.", "t": "answer", "tip": "'Why' (any microorganism could be the cause) + 'how' (4 postulates) + conclusion."}, {"q": "When travellers enter Australia from overseas they must declare all plant and animal matter. Explain why. (4 marks)", "a": "Declaration is a <b>quarantine measure<\/b>. Plant and animal matter from overseas may carry <b>exotic pests or diseases<\/b>, increasing the risk of introducing new disease to Australia. <b>Resident organisms are unlikely to have been exposed<\/b> to them and are therefore <b>more susceptible<\/b>. Declared items can be <b>assessed/inspected<\/b>, and infected matter is <b>treated with pesticides/insecticides or destroyed<\/b> to prevent the spread of disease.", "t": "answer", "tip": ""}, {"q": "Describe the difference between the roles of TWO named types of T cells in the immune response in humans. (4 marks)", "a": "<b>T helper cells<\/b> are part of the <b>initial response<\/b> to an antigen. They release <b>cytokines<\/b>, which increase the <b>activity of phagocytes<\/b>, promote <b>inflammation<\/b>, stimulate growth of <b>B cells<\/b> responding to the antigen and stimulate production of <b>cytotoxic T cells<\/b>. In contrast, <b>T memory cells<\/b> interact with the antigen initially but <b>remain dormant<\/b> until the <b>next infection<\/b>; on <b>secondary exposure<\/b> they quickly recognise the antigen and activate a <b>larger and faster<\/b> response.", "t": "answer", "tip": "'Difference' → each cell's role, with a contrast word ('In contrast')."}, {"q": "Explain why the combined use of quarantine and vaccination programs is more effective in controlling disease than using only one of these strategies. (5 marks)", "a": "<b>Quarantine<\/b> isolates organisms to <b>prevent exposure<\/b> to a pathogen, but it provides <b>no immunity<\/b>, so if exposed they can develop disease. <b>Vaccination<\/b> exposes an organism to the pathogen's <b>antigens<\/b>, generating <b>adaptive immunity<\/b> through <b>T and B memory cells<\/b> specific to the antigen, so the immune system can respond if exposed later. However, immunity <b>takes time to develop<\/b> and organisms may be infected <b>before vaccination<\/b>, so disease can still spread. Neither alone is guaranteed, so using both <b>simultaneously<\/b> provides <b>security if one strategy fails<\/b>.", "t": "answer", "tip": "Strength + weakness of EACH, then the 'therefore combined' link."}, {"q": "Analyse factors that could have contributed to the change in global distribution of dengue fever and malaria over the last 100 years. Support your answer with the data. (Medical advancements paragraph — use the same layout for Travel and Population increase) (7 marks)", "a": "<b>Medical advancements:<\/b> medical advances can <b>prevent or control<\/b> these diseases, e.g. <b>vaccines<\/b> for dengue and <b>anti-malarial drugs such as chloroquine<\/b>. The <b>decrease in % of the global population at risk of malaria (1900–1994)<\/b> suggests these advances contained malaria to some extent. However, the <b>increase in countries with malaria and % at risk (1994–2010)<\/b> suggests <b>chloroquine resistance<\/b> in the pathogen/mosquitoes is reducing effectiveness. The <b>wide distribution of dengue in 2010<\/b> suggests there are no suitable vaccines/drugs or they are not widely applied, or the virus <b>evolves quickly<\/b>. Overall, pharmaceuticals appear <b>more effective for malaria than dengue<\/b>.<br><b>Travel:<\/b> (add) increased global travel moves infected people/vectors into new regions → wider distribution. <b>Population increase:<\/b> (add) more people living in/near vector habitats and denser populations → more people at risk.", "t": "answer", "tip": "7-mark Analyse: 3 factors × (factor → data quote → reason) + overall judgement. Quote years, % and country counts."}, {"q": "Explain how antibiotics treat bacterial infections and why their effectiveness decreases. (4 marks)", "a": "<b>Antibiotics<\/b> target <b>biochemical pathways and molecules unique to bacteria<\/b>, such as <b>cell wall synthesis, nucleic acid synthesis, protein synthesis<\/b> and certain metabolic pathways (e.g. <b>penicillin<\/b>), so they treat bacterial infection. Their effectiveness decreases because <b>overuse and mismanagement<\/b> select for bacteria that develop <b>resistance<\/b>; <b>resistant bacteria pass the resistance gene to their offspring<\/b>, increasing resistance in the population.", "t": "answer", "tip": "Link to Mod 6: antibiotic = selection pressure, resistance allele frequency increases."}, {"q": "Distinguish between active and passive immunity, giving a natural example of each. (4 marks)", "a": "<b>Active immunity<\/b> occurs when the body is <b>stimulated by an antigen<\/b> to make <b>its own T cells, B cells and antibodies<\/b>; naturally, this is the response to an antigen encountered through a <b>disease<\/b> (artificially, by <b>vaccination<\/b>). <b>Passive immunity<\/b> occurs when <b>antibodies are transferred<\/b> to an unimmunised person; naturally, a <b>baby receives antibodies from its mother<\/b> (artificially, by injection of antibodies from someone else).", "t": "answer", "tip": ""}, {"q": "Describe the role of antibodies in the immune response. (4 marks)", "a": "<b>B lymphocytes<\/b> stimulated by a specific antigen proliferate into <b>plasma cells<\/b> that produce <b>antibodies<\/b>. Antibodies interfere with the pathogen's functioning so it is <b>unable to cause damage<\/b> and easier for the immune system to destroy, by <b>neutralisation, precipitation, agglutination<\/b> and <b>activation of the complement system<\/b>. <b>Memory B cells<\/b> remain in lymph tissue so later responses are <b>faster, stronger and longer lasting<\/b>.", "t": "answer", "tip": ""}, {"q": "Compare the innate and adaptive immune responses (or: outline the roles of phagocytes in immunity). (4 marks)", "a": "The <b>innate<\/b> response is <b>non-specific<\/b> and includes <b>phagocytosis<\/b> (neutrophils, macrophages, dendritic cells), <b>natural killer cells<\/b>, <b>inflammation<\/b> and the <b>complement system<\/b>. The <b>adaptive<\/b> response is <b>specific<\/b> to an antigen, involving <b>B lymphocytes<\/b> (antibody-mediated) and <b>T lymphocytes<\/b> (cell-mediated), and produces <b>memory cells<\/b> giving a faster, stronger response on re-exposure. <b>Macrophages and dendritic cells link the two<\/b> by presenting antigens to T lymphocytes.", "t": "answer", "tip": "'Non-specific vs specific' is extra framing but standard syllabus language."}, {"q": "Explain how plants defend themselves against pathogens. (4 marks)", "a": "Plants have <b>general physical defences<\/b> (tiny bristles, waxy cuticle, cell wall) and <b>chemical defences<\/b> (antimicrobials, toxins). Their immune response includes <b>basal resistance<\/b> (plant becomes impenetrable), <b>gene-for-gene resistance<\/b> (plant has a resistance gene and the pathogen lacks a virulence gene), the <b>hypersensitive response<\/b> (<b>apoptosis<\/b> of host cells) and <b>systemic acquired resistance<\/b> (reactions activated after exposure to a pathogen).", "t": "answer", "tip": ""}, {"q": "Explain why antibiotics are ineffective against viral infections, and outline a treatment for viral infections. (3 marks)", "a": "Antibiotics target <b>pathways and molecules unique to bacteria<\/b> (e.g. cell wall, protein synthesis), which viruses (<b>non-cellular<\/b>) do not have. <b>Antivirals<\/b> instead target features unique to viruses such as <b>viral nucleic acids and proteins<\/b>, or <b>block entry/spread<\/b> between cells, e.g. for herpes and HIV.", "t": "answer", "tip": ""}, {"q": "Evaluate the use of hygiene practices and vaccination in preventing disease. (4 marks)", "a": "<b>Hygiene practices<\/b> are <b>useful and simple<\/b> but have a <b>general effect rather than targeting a specific disease<\/b>. <b>Vaccination<\/b> <b>reduces the number of people a disease can affect<\/b> and provides <b>herd immunity<\/b> for immunocompromised individuals, but <b>immunity takes time to develop<\/b>. Using both gives broader and more reliable protection.", "t": "answer", "tip": ""}]}, {"id": "mod8", "name": "Module 8: Non-infectious Disease & Disorder", "short": "Mod 8", "cards": [{"q": "Define homeostasis.", "a": "Process by which the body maintains a constant internal environment, using nerves and hormones.", "t": "recall"}, {"q": "Stimulus-response model order?", "a": "Stimulus → receptor → control centre → effector (muscle/gland) → response restores internal conditions.", "t": "recall"}, {"q": "Negative feedback loop?", "a": "Form of stimulus-response where feedback causes a reversal in the effect of the stimulus.", "t": "recall"}, {"q": "Ectotherm vs endotherm?", "a": "Ectotherms thermoregulate using only environment; endotherms use physiological and behavioural responses.", "t": "recall"}, {"q": "Thermoreceptors / control centre in thermoregulation?", "a": "Thermoreceptors in skin and blood; hypothalamus coordinates nervous and hormonal response.", "t": "recall"}, {"q": "Xerophyte adaptations (4)?", "a": "Reduced stomata, sunken stomata, hairy leaves, drooping leaves.", "t": "recall"}, {"q": "Mesophyte adaptations (2)?", "a": "Closed stomata, cuticles.", "t": "recall"}, {"q": "Hydrophyte adaptations (2)?", "a": "Large & flat leaves, increased stomata.", "t": "recall"}, {"q": "3 halophyte mechanisms?", "a": "Salt exclusion (roots/lower stem), salt excretion (leaf glands), salt accumulation (older tissues shed).", "t": "recall"}, {"q": "CNS vs PNS?", "a": "CNS coordinates information; PNS carries messages around.", "t": "recall"}, {"q": "Somatic vs autonomic?", "a": "Somatic: voluntary control of body movements. Autonomic: involuntary bodily processes.", "t": "recall"}, {"q": "Sympathetic vs parasympathetic?", "a": "Sympathetic prepares body for action; parasympathetic relaxes body.", "t": "recall"}, {"q": "3 neuron types?", "a": "Sensory (receptors → CNS), motor (CNS → effectors), interneurons (between sensory & motor in CNS).", "t": "recall"}, {"q": "Endocrine system definition?", "a": "Group of glands that secrete hormones directly into the blood; hormones bind specific receptors on target cells.", "t": "recall"}, {"q": "Pancreas hormones?", "a": "Glucagon and insulin.", "t": "recall"}, {"q": "Adrenal hormones?", "a": "Aldosterone, adrenaline, noradrenaline.", "t": "recall"}, {"q": "Pituitary hormones? Hypothalamus?", "a": "ADH, TSH, growth hormone, FSH. TRH.", "t": "recall"}, {"q": "Thyroid / pineal / thymus hormones?", "a": "T3, T4 / melatonin / thymosin.", "t": "recall"}, {"q": "Glucagon: cells, target, mechanism?", "a": "Alpha cells; liver & muscle; glycogen → glucose; increases BGL.", "t": "recall"}, {"q": "Insulin: cells, target, mechanisms?", "a": "Beta cells; liver, muscle, fat; glucose → glycogen, ↑ glucose uptake, glucose → fatty acids; decreases BGL.", "t": "recall"}, {"q": "Non-infectious disease definition?", "a": "Not caused by a pathogen and cannot be transmitted between organisms.", "t": "recall"}, {"q": "4 causes of non-infectious disease?", "a": "Genetic disorders, environmental factors, cancer, nutritional disorders.", "t": "recall"}, {"q": "Define cancer.", "a": "Unregulated, abnormal cell growth caused by genetic mutations (can be triggered by environmental carcinogens).", "t": "recall"}, {"q": "Epidemiology measures?", "a": "Prevalence, incidence and mortality.", "t": "recall"}, {"q": "Conductive vs sensorineural hearing loss?", "a": "Conductive: damage to outer/middle ear. Sensorineural: damage to inner ear or nerve pathways to brain.", "t": "recall"}, {"q": "Auditory processing disorder? Tinnitus?", "a": "Defects in auditory areas of brain. Hearing ringing in ears (loud sound or ageing).", "t": "recall"}, {"q": "Hearing aids / bone conduction / cochlear implant?", "a": "Amplify (mild-severe); vibrations direct to cochlea (conductive); bypass damage, stimulate auditory nerve (profound).", "t": "recall"}, {"q": "Role of iris and lens?", "a": "Iris alters pupil size (light amount); lens changes shape to focus (accommodation).", "t": "recall"}, {"q": "Myopia & hyperopia treatments?", "a": "Myopia: concave lens / cornea curvature decreased. Hyperopia: convex lens / cornea curvature increased.", "t": "recall"}, {"q": "Retina disorders (3)?", "a": "Retinopathy, macular degeneration, colour blindness.", "t": "recall"}, {"q": "Kidney function in one line?", "a": "Filters blood and excretes excess wastes, salt and water to maintain homeostasis.", "t": "recall"}, {"q": "4 stages of urine formation/excretion?", "a": "Filtration, reabsorption & secretion, storage, urination.", "t": "recall"}, {"q": "4 kidney disorders?", "a": "Glomerulonephritis, diabetic nephropathy, polycystic kidney disease, kidney stones.", "t": "recall"}, {"q": "Dialysis vs transplant: + and − ?", "a": "Dialysis: decent quality of life / time consuming. Transplant: longer, more normal life / possible kidney failure, immunosuppressive drug risks.", "t": "recall"}, {"q": "Using a named example, explain how a negative feedback loop maintains body temperature in an endotherm. (5 marks)", "a": "<b>Example – body temperature rises.<\/b> The <b>stimulus<\/b> is a change in body temperature. <b>Thermoreceptors<\/b> in the skin and blood detect it and send a message to the <b>control centre<\/b>, the <b>hypothalamus<\/b>, which coordinates a nervous and hormonal response. It signals <b>effectors<\/b> (e.g. sweat glands, skin blood vessels), which respond (sweating/vasodilation) to lower body temperature. This <b>reverses<\/b> the original stimulus – <b>negative feedback<\/b> – restoring the internal environment.", "t": "answer", "tip": "Name each of the 5 loop parts. Effector examples are extra to your slide."}, {"q": "Compare how ectotherms and endotherms regulate body temperature. (3 marks)", "a": "<b>Ectotherms<\/b> thermoregulate using <b>only their environment<\/b>, whereas <b>endotherms<\/b> adjust their internal conditions through <b>physiological and behavioural responses<\/b>.", "t": "answer", "tip": ""}, {"q": "Explain how insulin and glucagon maintain blood glucose levels. (5 marks)", "a": "When blood glucose is <b>high<\/b>, <b>beta cells<\/b> of the pancreas release <b>insulin<\/b>, which acts on <b>liver, muscle and fat cells<\/b>: it increases conversion of <b>glucose to glycogen<\/b>, increases <b>uptake of glucose<\/b> and converts glucose to <b>fatty acids<\/b> (liver), so <b>BGL decreases<\/b>. When blood glucose is <b>low<\/b>, <b>alpha cells<\/b> release <b>glucagon<\/b>, which acts on <b>liver and muscle cells<\/b> to convert <b>glycogen to glucose<\/b>, so <b>BGL increases<\/b>. These opposing actions form a <b>negative feedback loop<\/b>.", "t": "answer", "tip": "Hit: alpha/beta, target cells, mechanism, direction of BGL change, negative feedback."}, {"q": "Describe the adaptations of xerophytes and hydrophytes to their environments. (4 marks)", "a": "<b>Xerophytes<\/b> (dry environments, e.g. eucalyptus) have <b>reduced and sunken stomata, hairy leaves and drooping leaves<\/b>, which reduce water loss. <b>Hydrophytes<\/b> (wet environments, e.g. water lilies) have <b>large, flat leaves and increased stomata<\/b>.", "t": "answer", "tip": ""}, {"q": "Explain the mechanisms halophytes use to survive in salty environments. (3 marks)", "a": "<b>Salt exclusion:<\/b> special tissues in the roots and lower stem stop salt entering but allow water uptake. <b>Salt excretion:<\/b> the plant actively concentrates salt and excretes it through <b>glands on the leaves<\/b>, where it crystallises and is blown/washed away. <b>Salt accumulation:<\/b> salt is deposited in <b>older tissues<\/b> such as leaves, which are then <b>shed<\/b>.", "t": "answer", "tip": ""}, {"q": "Compare the sympathetic and parasympathetic nervous systems. (3 marks)", "a": "Both are divisions of the <b>autonomic<\/b> nervous system, which controls <b>involuntary<\/b> bodily processes (part of the PNS). The <b>sympathetic<\/b> system <b>prepares the body for action<\/b>, whereas the <b>parasympathetic<\/b> system <b>relaxes<\/b> the body.", "t": "answer", "tip": ""}, {"q": "Outline the causes of non-infectious disease. (4 marks)", "a": "Non-infectious diseases are <b>not caused by a pathogen<\/b> and <b>cannot be transmitted<\/b>. Causes include: <b>genetic disorders<\/b> (faulty production of a protein, e.g. cystic fibrosis); <b>environmental factors<\/b> (overstimulating the immune system or increasing the risk of mutations); <b>cancer<\/b> (unregulated abnormal cell growth caused by mutations triggered by environmental carcinogens); and <b>nutritional disorders<\/b> (under-/over-consumption or imbalance of nutrients).", "t": "answer", "tip": ""}, {"q": "Explain how epidemiological data can be used to determine the cause of a non-infectious disease such as lung cancer. (Data approach) (4 marks)", "a": "Epidemiology measures <b>prevalence, incidence and mortality<\/b> in populations. Comparing these between groups (e.g. exposed vs. not exposed to an environmental factor such as smoking) can <b>identify a link<\/b> between the factor and the disease. State specific figures and trend from the data, e.g. 'lung cancer incidence is X in smokers vs Y in non-smokers'; however, data shows <b>correlation, not proof of causation<\/b>.", "t": "answer", "tip": "Quote numbers + units + trend. Extra reasoning: correlation ≠ causation."}, {"q": "Distinguish between conductive and sensorineural hearing loss and name a suitable technology for each. (4 marks)", "a": "<b>Conductive<\/b> hearing loss is caused by damage to the <b>outer or middle ear<\/b>; it can be treated with <b>bone conduction implants<\/b>, which send vibrations directly to the cochlea (or hearing aids). <b>Sensorineural<\/b> hearing loss is caused by damage to the <b>inner ear or the nerve pathways<\/b> to the brain; <b>profound<\/b> loss can be treated with a <b>cochlear implant<\/b>, which <b>bypasses the damaged area and stimulates the auditory nerve directly<\/b> (hearing aids <b>amplify<\/b> sound in mild–severe loss).", "t": "answer", "tip": ""}, {"q": "Explain how myopia and hyperopia are caused and corrected. (4 marks)", "a": "Both are <b>refractive errors<\/b> in which light <b>doesn't fall correctly on the retina<\/b>, causing blurry vision, caused by a <b>misshapen lens or eyeball<\/b>. <b>Myopia<\/b> (short-sightedness) is corrected with <b>concave lenses<\/b> or laser surgery that <b>decreases the curvature of the cornea<\/b>. <b>Hyperopia<\/b> (long-sightedness) is corrected with <b>convex lenses<\/b> or laser surgery that <b>increases the curvature of the cornea<\/b>.", "t": "answer", "tip": ""}, {"q": "Describe how the eye produces a visual image. (4 marks)", "a": "<b>Light enters through the pupil<\/b>; the <b>iris<\/b> alters pupil size and so the amount of light entering. The <b>lens<\/b> changes shape (<b>accommodation<\/b>) to focus on objects at different distances. <b>Photoreceptors<\/b> in the <b>retina<\/b> detect the light and generate a <b>nerve impulse<\/b>, which is sent via the <b>optic nerve<\/b> to the <b>visual centres of the brain<\/b>.", "t": "answer", "tip": ""}, {"q": "Outline the role of the kidney in homeostasis and how kidney function is affected by kidney disorders. (4 marks)", "a": "The kidney <b>filters the blood<\/b> (filtration at the glomerulus), then tubules carry out <b>reabsorption and secretion<\/b>, <b>excreting excess wastes, salt and water<\/b> as urine, which is <b>stored<\/b> in the bladder before <b>urination<\/b>. In kidney disorders (e.g. glomerulonephritis, diabetic nephropathy, polycystic kidney disease, kidney stones) the kidney can't <b>filter blood effectively<\/b>, so <b>metabolic wastes build up<\/b> and <b>salt and water levels become imbalanced<\/b>.", "t": "answer", "tip": ""}, {"q": "Evaluate dialysis and kidney transplants as treatments for kidney disorders. (5 marks)", "a": "<b>Dialysis<\/b> removes <b>wastes and excess fluid<\/b> from the blood using an external <b>dialyser<\/b>; patients can continue living with a <b>decent quality of life<\/b>, but it is <b>time consuming<\/b>. A <b>kidney transplant<\/b> replaces the damaged kidney with a healthy one from a <b>matching donor<\/b>, giving a <b>longer and more 'normal' life<\/b>, but carries risks of <b>kidney failure<\/b> and of <b>immunosuppressive drugs<\/b>. <b>Judgement:<\/b> a transplant gives better long-term outcomes where a matching donor is available, while dialysis is the option when one is not / as a bridge.", "t": "answer", "tip": "Evaluate needs a judgement. The final 'when' clause is extra."}]}];
const KEY='bio-drill-v1';
let status={}; try{status=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(status))}catch(e){}}
const all=[]; DATA.forEach(d=>d.cards.forEach((c,i)=>all.push({...c,id:d.id+'-'+i,mod:d.id,short:d.short})));
let sel={mods:new Set(DATA.map(d=>d.id)),types:new Set(['recall','answer']),missedOnly:false,shuffle:true};
let deck=[],pos=0,shown=false;
const $=s=>document.querySelector(s);
function chip(parent,label,on,fn){const b=document.createElement('button');b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',on);b.onclick=()=>{fn(b)};parent.appendChild(b);return b}
DATA.forEach(d=>chip($('#mods'),d.short,true,b=>{toggle(sel.mods,d.id);b.setAttribute('aria-pressed',sel.mods.has(d.id));rebuild()}));
[['recall','Quick recall'],['answer','Model answers']].forEach(([k,l])=>chip($('#types'),l,true,b=>{toggle(sel.types,k);b.setAttribute('aria-pressed',sel.types.has(k));rebuild()}));
chip($('#opts'),'Missed only',false,b=>{sel.missedOnly=!sel.missedOnly;b.setAttribute('aria-pressed',sel.missedOnly);rebuild()});
chip($('#opts'),'Shuffle',true,b=>{sel.shuffle=!sel.shuffle;b.setAttribute('aria-pressed',sel.shuffle);rebuild()});
const rs=document.createElement('button');rs.className='link';rs.textContent='Reset progress';rs.onclick=()=>{status={};save();rebuild()};$('#opts').appendChild(rs);
function toggle(s,v){if(s.has(v)){if(s.size>1)s.delete(v)}else s.add(v)}
function rebuild(){
  deck=all.filter(c=>sel.mods.has(c.mod)&&sel.types.has(c.t)&&(!sel.missedOnly||status[c.id]==='m'));
  if(sel.shuffle){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
  pos=0;shown=false;render();
}
function render(){
  const g=deck.filter(c=>status[c.id]==='g').length,m=deck.filter(c=>status[c.id]==='m').length,n=deck.length||1;
  $('#stat').textContent=deck.length?`${Math.min(pos+1,deck.length)} / ${deck.length} · ${g} got · ${m} missed`:'0 cards';
  $('#bg').style.width=(g/n*100)+'%';$('#bm').style.width=(m/n*100)+'%';
  const st=$('#stage');st.innerHTML='';
  if(!deck.length){st.innerHTML='<div class="done"><h2>No cards here</h2><p>'+(sel.missedOnly?'Nothing marked as missed yet in this selection.':'Pick at least one module and type.')+'</p></div>';return}
  if(pos>=deck.length){st.innerHTML='<div class="done"><h2>Round complete</h2><p>'+g+' got it, '+m+' missed. Turn on “Missed only” and go again.</p></div>';return}
  const c=deck[pos];
  const card=document.createElement('button');card.className='card';card.type='button';
  card.innerHTML='<div class="meta"><span>'+c.short+'</span><span>'+(c.t==='answer'?'Model answer':'Quick recall')+'</span></div><div class="q"></div>'+(shown?'<div class="a">'+c.a+(c.tip?'<div class="tip">✔ '+c.tip+'</div>':'')+'</div>':'<div class="hint">Say or write your answer first, then tap to reveal.</div>');
  card.querySelector('.q').textContent=c.q;
  card.onclick=()=>{shown=!shown;render()};
  st.appendChild(card);
  const row=document.createElement('div');row.className='row';row.style.marginTop='12px';
  const bm=document.createElement('button');bm.className='btn m';bm.textContent='Missed it';bm.disabled=!shown;bm.onclick=()=>mark('m');
  const bg=document.createElement('button');bg.className='btn g';bg.textContent='Got it';bg.disabled=!shown;bg.onclick=()=>mark('g');
  row.append(bm,bg);st.appendChild(row);
  const nav=document.createElement('div');nav.className='nav';
  const pv=document.createElement('button');pv.className='link';pv.textContent='Previous';pv.onclick=()=>{if(pos>0){pos--;shown=false;render()}};
  const sk=document.createElement('button');sk.className='link';sk.textContent='Skip';sk.onclick=()=>{pos++;shown=false;render()};
  nav.append(pv,sk);st.appendChild(nav);
}
function mark(v){status[deck[pos].id]=v;save();pos++;shown=false;render()}
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button.chip,button.link'))return;
  if(e.key===' '||e.key==='Enter'){if(e.target.classList&&e.target.classList.contains('card'))return;e.preventDefault();shown=!shown;render()}
  else if(shown&&e.key==='1')mark('m'); else if(shown&&e.key==='2')mark('g');
});
rebuild();
</script>

      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Offline mode active!', reg.scope))
        .catch(err => console.log('Offline setup failed: ', err));
    });
